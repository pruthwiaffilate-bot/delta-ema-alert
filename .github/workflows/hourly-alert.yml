name: Hourly EMA alert

on:
  schedule:
    # GitHub Actions schedules use UTC. Runs at :30 from 06:30 through 23:30 UTC.
    - cron: "30 6-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-ema-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      CHECK_INTERVAL: "3600"
      TIMEFRAME: "1h"
      SYMBOLS: "ETHUSDT,BTCUSDT,SOLUSDT,XRPUSDT"
      RUN_ONCE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one hourly check
        run: python main.py

      - name: Persist alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update alert state"
          git push